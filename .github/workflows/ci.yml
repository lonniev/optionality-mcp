# Canonical DPYC commit-phase CI — lint + tests. Job `test` + matrix ["3.12"] posts the
# fleet-canonical status context `test (3.12)`, which branch protection requires. ruff skips
# node_modules by default, so `ruff check .` covers the Python (server/tools/db/claude) without
# touching the frontend/. The tests are mock-based (unittest.mock), so no secrets are needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The frontend, built the same way it is built on the way to production.
  #
  # Added fleet-wide after cypher-mcp PR #121 (tailwind 3 -> 4) went green on
  # every check that repo ran, merged, broke `main`, and was only caught by the
  # deploy — one step after it could still have been prevented. Five of the
  # seven repos with a frontend had this gap. Green has to mean the site still
  # builds.
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The same command production runs. A break here is a break there.
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_MCP_URL: /mcp

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The build-and-verify contract every DPYC MCP shares — install the way
      # Horizon installs, lint, prove the entrypoint, run the suite. A composite
      # action, not a reusable workflow, so this job keeps its name and with it the
      # `test` status context branch protection requires.
      - uses: lonniev/dpyc-community/.github/actions/mcp-ci@main
        with:
          test-command: uv run pytest tests/ -v

      # `modal_app.py` sits outside the package, so nothing imports it — its deploy
      # graph (image, mounted source, function spec) would otherwise first be
      # evaluated during `modal deploy`, after merge. Needs no credentials: App,
      # Image and Secret.from_name are lazy until a real API call.
      - name: The detached runner's deploy graph builds
        run: uv run python -c "import modal_app; print('modal_app builds:', modal_app.app.name)"

