name: Deploy Modal Drill Runner

# `modal_app.py` is where a drill is actually RUN — the LLM call, the web
# lookups, the fare. Horizon only dispatches; the work happens in this container.
#
# The image builds from `pyproject.toml` and mounts the operator's own modules at
# DEPLOY time. `add_local_python_source` skips an image *rebuild* on a code
# change — it does not skip the redeploy. So a source change with no redeploy
# leaves Modal running code that exists nowhere else. eXcalibur learned this the
# expensive way: a release raised a budget and bumped the SDK, both reached
# Horizon, neither reached Modal, and for a day the container silently enforced
# the old ceiling. The release was green, tagged, and inert.
#
# Hence the deliberately wide paths filter: this is not a "modal_app.py changed"
# trigger, it is a "what Modal executes changed" trigger.
on:
  push:
    branches: [main]
    paths:
      - "modal_app.py"
      - "server.py"
      - "config.py"
      - "llm.py"
      - "prompts.py"
      - "tools/**"
      - "db/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-modal.yml"
  # The release gate. `release.yml` creates the GitHub Release on a `v*` tag; this
  # fires on that and checks out the RELEASED tag rather than whatever main has
  # drifted to, so the container runs the commit that was actually released.
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  # Two deploys racing would leave the live version decided by whichever finished
  # last.
  group: deploy-modal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # On a release event, deploy the tag — not main.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.0.0

      # `uv sync --locked` is how Horizon installs: fastmcp's UVEnvironment.prepare()
      # shells out to `uv sync`, and build_command() prefixes `uv run`. Installing with
      # pip here meant CI validated a resolution the deploy never used — and `--locked`
      # additionally fails on a stale lock, so drift is a pre-merge error instead of a
      # deploy-time surprise.
      - name: Install dependencies (the lockfile Horizon deploys)
        run: uv sync --locked --extra dev

      # The tokens are repo secrets, NOT read from the operator vault. The
      # tempting alternative — give CI the nsec and pull the Modal tokens out of
      # the vault — would hand a build runner the credential that unlocks every
      # operator secret (the model-router key, BTCPay, patron sessions) in order
      # to obtain the weakest one in the system. A Modal token can redeploy an
      # app; it cannot open the vault.
      #
      # The invariant is "the live container runs THIS commit's content", which
      # is not the same as "a version stamped with this commit exists".
      #
      # Modal deduplicates: when the image, function spec and mounted source are
      # byte-identical to what is live it cuts no new version and says "no
      # changes detected". That is the invariant HOLDING, not failing — and it is
      # the common case, because the paths filter is deliberately wider than the
      # image.
      - name: Deploy to Modal and verify the live version
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${MODAL_TOKEN_ID:-}" ] || [ -z "${MODAL_TOKEN_SECRET:-}" ]; then
            echo "::error::MODAL_TOKEN_ID / MODAL_TOKEN_SECRET are not set on this repo."
            echo "Detached execution stays off until they are; drills run in-process."
            exit 1
          fi
          APP=$(python -c "import modal_app; print(modal_app.app.name)")
          EXPECTED=$(git rev-parse --short HEAD)

          # tee so the deploy output is still in the log we assert against.
          modal deploy modal_app.py 2>&1 | tee "$RUNNER_TEMP/modal-deploy.log"

          if grep -q 'no changes detected' "$RUNNER_TEMP/modal-deploy.log"; then
            echo "$APP already runs this commit's content — Modal cut no new version."
            exit 0
          fi

          HISTORY=$(COLUMNS=200 modal app history "$APP")
          echo "$HISTORY"
          if ! echo "$HISTORY" | grep -q "$EXPECTED"; then
            echo "::error::$APP cut a new version, but not at $EXPECTED"
            exit 1
          fi
          echo "$APP is live at $EXPECTED"
